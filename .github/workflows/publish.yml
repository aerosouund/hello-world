name: Build, Push and Attest

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build-push-sign:
    name: Build, Push and Attest (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # required for keyless (OIDC) cosign attestation
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./amd64
          file: ./amd64/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Generate SLSA provenance predicate
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          jq -n \
            --arg server "$SERVER_URL" \
            --arg repo "$REPOSITORY" \
            --arg ref "$REF" \
            --arg sha "$SHA" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg event "$EVENT_NAME" \
            --arg runId "$RUN_ID" \
            --arg attempt "$RUN_ATTEMPT" \
            '{
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: {
                  workflow: {
                    ref: $ref,
                    repository: "\($server)/\($repo)",
                    path: ($workflowRef | sub("^[^/]+/[^/]+/"; "") | sub("@.*$"; ""))
                  }
                },
                internalParameters: {
                  github: { event_name: $event }
                },
                resolvedDependencies: [
                  { uri: "git+\($server)/\($repo)@\($ref)", digest: { gitCommit: $sha } }
                ]
              },
              runDetails: {
                builder: { id: "\($server)/\($workflowRef)" },
                metadata: { invocationId: "\($server)/\($repo)/actions/runs/\($runId)/attempts/\($attempt)" }
              }
            }' > provenance.json
          cat provenance.json

      - name: Attest provenance (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # signing config from the Sigstore TUF root, with Rekor v2 as the transparency log
          cosign signing-config create --with-default-rekor-v2 --out signing-config.json
          jq '.rekorTlogUrls' signing-config.json
          cosign attest --yes \
            --signing-config signing-config.json \
            --type slsaprovenance1 \
            --predicate provenance.json \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Verify attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify-attestation \
            --type slsaprovenance1 \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" > /dev/null
